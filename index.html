<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Links - VIP Profile</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            /* پاشبنەما ب وێنەیێ تە و فیلتەرێ تاریک و مات (VIP Background) */
            background-color: #030712;
            background-image: linear-gradient(rgba(3, 7, 18, 0.85), rgba(3, 7, 18, 0.92)), url('logo.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #38bdf8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 35px 20px;
            box-shadow: 0 0 40px rgba(56, 189, 248, 0.25);
            border: 1px solid rgba(56, 189, 248, 0.3);
            text-align: center;
        }
        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #38bdf8;
            margin-bottom: 15px;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.5);
        }
        h1 {
            font-size: 26px;
            margin-bottom: 25px;
            color: #38bdf8;
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
            letter-spacing: 1px;
        }
        .links-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            border-radius: 14px;
            background: rgba(30, 41, 59, 0.75);
            color: #38bdf8;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 1px solid rgba(56, 189, 248, 0.25);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        .btn:hover {
            background: #38bdf8;
            color: #030712;
            transform: translateY(-3px);
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.7);
            border-color: #38bdf8;
        }
        .btn-content {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        /* ڕێکخستنا وێنەیێن پڕۆفایلێن د ناڤ دوگمەیان دا */
        .icon-img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }
    </style>
</head>
<body>

    <!-- Hidden Audio Player -->
    <audio autoplay loop hidden>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <!-- Main Website Logo / Profile Image -->
        <img src="logo.png" alt="Logo" class="profile-img">
        <h1>Yuseef</h1>

        <div class="links-list">
            <!-- TikTok -->
            <a href="https://www.tiktok.com/@yuseef_surchi?_r=1&_t=ZS-98cYzDWJTVN" class="btn" target="_blank">
                <div class="btn-content">
                    <img src="tiktok.png" alt="TikTok Profile" class="icon-img">
                    <span>Join TikTok</span>
                </div>
                <span>→</span>
            </a>
            
            <!-- Snapchat -->
            <a href="https://snapchat.com/t/6KjVProO" class="btn" target="_blank">
                <div class="btn-content">
                    <img src="snapchat.png" alt="Snapchat Profile" class="icon-img">
                    <span>Join Snapchat</span>
                </div>
                <span>→</span>
            </a>
            
            <!-- Telegram Profile -->
            <a href="https://t.me/YUSEEF_SURCHI" class="btn" target="_blank">
                <div class="btn-content">
                    <img src="telegram1.png" alt="Telegram Profile" class="icon-img">
                    <span>Join Telegram Profile</span>
                </div>
                <span>→</span>
            </a>
            
            <!-- Telegram Group -->
            <a href="https://t.me/legend_group21" class="btn" target="_blank">
                <div class="btn-content">
                    <img src="telegram1.png" alt="Telegram Group" class="icon-img">
                    <span>Join Telegram Group</span>
                </div>
                <span>→</span>
            </a>
            
            <!-- Telegram Channel -->
            <a href="https://t.me/legend_mods33" class="btn" target="_blank">
                <div class="btn-content">
                    <img src="telegram2.png" alt="Telegram Channel" class="icon-img">
                    <span>Join Telegram Channel</span>
                </div>
                <span>→</span>
            </a>
        </div>
    </div>

</body>
</html>
