<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YUSEEF SINAN - VIP Profile</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            /* پاشبنەما ب وێنەیێ تە و فیلتەرێ تاریک و ڕەش و سپی */
            background-color: #000000;
            background-image: linear-gradient(rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.95)), url('logo.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: transparent;
            border: none;
            box-shadow: none;
            padding: 20px 10px;
            text-align: center;
        }
        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ffffff;
            margin-bottom: 15px;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.4);
        }
        h1 {
            font-size: 26px;
            margin-bottom: 5px;
            color: #ffffff;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.5);
            letter-spacing: 1px;
        }
        .sub-title {
            font-size: 14px;
            color: #a1a1aa;
            margin-bottom: 25px;
            letter-spacing: 1px;
            font-weight: 600;
        }
        .links-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            border-radius: 14px;
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
        .btn:hover {
            background: #ffffff;
            color: #000000;
            transform: translateY(-3px);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.6);
            border-color: #ffffff;
        }
        .btn-content {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .icon-img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ffffff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <!-- Hidden Audio Player -->
    <audio autoplay loop hidden>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <!-- Main Profile Image -->
        <img src="logo.png" alt="Logo" class="profile-img">
        <h1>YUSEEF SINAN</h1>
        <div class="sub-title">MY PROFILE</div>

        <div class="links-list">
            <!-- TikTok -->
            <a href="https://www.tiktok.com/@yuseef_surchi?_r=1&_t=ZS-98cYzDWJTVN" class="btn" target="_blank">
                <div class="btn-content">
                    <img src="tiktok.png" alt="TikTok" class="icon-img">
                    <span>Join TikTok</span>
                </div>
                <span>→</span>
            </a>
            
            <!-- Snapchat -->
            <a href="https://snapchat.com/t/6KjVProO" class="btn" target="_blank">
                <div class="btn-content">
                    <img src="snapchat.png" alt="Snapchat" class="icon-img">
                    <span>Join Snapchat</span>
                </div>
                <span>→</span>
            </a>
            
            <!-- Telegram Profile -->
            <a href="https://t.me/YUSEEF_SURCHI" class="btn" target="_blank">
                <div class="btn-content">
                    <img src="telegram1.png" alt="Telegram Profile" class="icon-img">
                    <span>Join Telegram Profile</span>
                </div>
                <span>→</span>
            </a>
            
            <!-- Telegram Group -->
            <a href="https://t.me/legend_group21" class="btn" target="_blank">
                <div class="btn-content">
                    <img src="telegram1.png" alt="Telegram Group" class="icon-img">
                    <span>Join Telegram Group</span>
                </div>
                <span>→</span>
            </a>
            
            <!-- Telegram Channel -->
            <a href="https://t.me/legend_mods33" class="btn" target="_blank">
                <div class="btn-content">
                    <img src="telegram2.png" alt="Telegram Channel" class="icon-img">
                    <span>Join Telegram Channel</span>
                </div>
                <span>→</span>
            </a>
        </div>
    </div>

</body>
</html>
